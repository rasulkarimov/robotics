# Install to /etc/systemd/journald.conf.d/persistent.conf
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# forcing Storage=volatile to spare the SD card. That means every reboot erases
# the evidence, which is exactly what this robot keeps needing: it has rebooted
# on its own under arm load, and twice "ты вчера опять отключился" could not be
# answered because there was nothing left to read.
#
# This dropin sorts after the factory one and wins. Journald was the ONLY copy of
# health_log's data that survived an unclean shutdown, and the only record of a
# 20-minute arm session that wrote no log line of its own.
#
# Capped so a persistent journal cannot fill the card.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=500M
MaxRetentionSec=1month
